# Master compose — includes all sub-stacks.
# Run: docker compose up -d
# Stop: docker compose down
#
# To start sub-stacks individually:
#   OLTP only:          docker compose -f postgres/docker-compose.oltp.yml up -d
#   CDC only:           docker compose -f postgres/docker-compose.oltp.yml -f src/cdc/docker-compose.cdc.yml up -d
#   Lakehouse only:     docker compose -f src/lakehouse/docker-compose.lakehouse.yml up -d
#   Observability only: docker compose -f src/monitoring/docker-compose.observability.yml up -d
#   Batch processing:   docker compose -f postgres/docker-compose.oltp.yml -f src/cdc/docker-compose.cdc.yml -f src/batch_processing/docker-compose.batch_processing.yml up -d
#   MLflow only:        docker compose -f src/lakehouse/docker-compose.lakehouse.yml -f src/mlflow/docker-compose.mlflow.yml up -d

include:
  - postgres/docker-compose.oltp.yml
  - src/cdc/docker-compose.cdc.yml
  - src/lakehouse/docker-compose.lakehouse.yml
  - src/monitoring/docker-compose.observability.yml
  - src/cdc_ingestion/docker-compose.cdc_ingestion.yml
  - src/orchestration/docker-compose.airflow.yml
  - src/mlflow/docker-compose.mlflow.yml
