[project]
name = "mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.128.0",
    "imbalanced-learn>=0.14.1",
    "joblib>=1.5.3",
    "feast[redis]>=0.40",
    "mlflow>=3.13.0,<4",
    "ml-dtypes>=0.5.0",
    "numpy>=1.22.0,<2", # feast>=0.40 requires numpy<2; revisit when feast supports numpy 2.x
    "onnx>=1.19.0",
    "onnxruntime>=1.23.0",
    "opentelemetry-distro>=0.62b0",
    "opentelemetry-exporter-otlp>=1.41.0",
    "opentelemetry-instrumentation-asgi==0.62b0",
    "opentelemetry-instrumentation-asyncio==0.62b0",
    "opentelemetry-instrumentation-click==0.62b0",
    "opentelemetry-instrumentation-dbapi==0.62b0",
    "opentelemetry-instrumentation-fastapi==0.62b0",
    "opentelemetry-instrumentation-grpc==0.62b0",
    "opentelemetry-instrumentation-httpx==0.62b0",
    "opentelemetry-instrumentation-jinja2==0.62b0",
    "opentelemetry-instrumentation-logging==0.62b0",
    "opentelemetry-instrumentation-requests==0.62b0",
    "opentelemetry-instrumentation-sqlalchemy==0.62b0",
    "opentelemetry-instrumentation-sqlite3==0.62b0",
    "opentelemetry-instrumentation-starlette==0.62b0",
    "opentelemetry-instrumentation-system-metrics==0.62b0",
    "opentelemetry-instrumentation-threading==0.62b0",
    "opentelemetry-instrumentation-tornado==0.62b0",
    "opentelemetry-instrumentation-tortoiseorm==0.62b0",
    "opentelemetry-instrumentation-urllib==0.62b0",
    "opentelemetry-instrumentation-urllib3==0.62b0",
    "opentelemetry-instrumentation-wsgi==0.62b0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.21",
    "scikit-learn>=1.8.0",
    "skl2onnx>=1.19.0",
    "uvicorn[standard]>=0.34.0,<1",
    "xgboost>=3.1.3",
    "clickhouse-connect==0.15.1",
    "confluent-kafka>=2.6.0",
    "dbt-trino>=1.10.1",
    "redis>=4.6.0",
    "trino>=0.337.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "pipeline_monitoring*"]

[tool.pytest.ini_options]
pythonpath = ["src", "src/batch_processing"]
testpaths = ["src/tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["notebooks/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "feast[redis]>=0.40",
    "ruff>=0.9.0",
    "catboost>=1.2.8",
    "delta-spark>=4.2.0",
    "httpx>=0.28.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.0",
    "optuna>=4.7.0",
    "pyspark>=4.1.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ydata-profiling[notebook]>=4.18.1",
    "psycopg[binary]>=3.2.10",
    "mlflow>=3.13.0,<4",
]
dbt = [
    "dbt-core~=1.10.0",
    "dbt-trino==1.10.1",
]
