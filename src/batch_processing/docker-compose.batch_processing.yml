services:
  spark-bronze-stream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-batch-processing
    entrypoint: ["python", "/opt/bronze/cdc_transactions_to_bronze.py"]
    volumes:
      - ./bronze:/opt/bronze:ro
    depends_on:
      kafka:
        condition: service_healthy
      connector-init:
        condition: service_completed_successfully
    restart: on-failure
