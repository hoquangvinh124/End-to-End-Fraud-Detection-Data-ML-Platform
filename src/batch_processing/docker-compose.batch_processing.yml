services:
  spark-bronze-stream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-batch-processing
    entrypoint: ["/opt/spark/bin/spark-submit", "/opt/bronze/cdc_transactions_to_bronze.py"]
    volumes:
      - ./bronze:/opt/bronze:ro
    depends_on:
      kafka:
        condition: service_healthy
      connector-init-debezium:
        condition: service_completed_successfully
    restart: on-failure

  spark-silver-batch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-silver-batch
    entrypoint:
      - /opt/spark/bin/spark-submit
      - /opt/silver/cdc_transactions_normalize_merge_silver.py
    volumes:
      - ./silver:/opt/silver:ro
    depends_on:
      spark-bronze-stream:
        condition: service_started
    restart: on-failure
