# Spark configuration for batch processing jobs.
# Spark loads this file automatically from $SPARK_HOME/conf/spark-defaults.conf.
# Job-specific properties use spark.<job>.* namespaces.

spark.master                                        local[*]

# Timezone — all timestamps interpreted as UTC
spark.sql.session.timeZone                          UTC

# Delta Lake extensions (required for Silver Delta read/write operations)
spark.sql.extensions                                io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                     org.apache.spark.sql.delta.catalog.DeltaCatalog

# Delta Lake — enable Change Data Feed on all new Delta tables by default
spark.databricks.delta.properties.defaults.enableChangeDataFeed  true

# Hive Metastore
spark.hadoop.hive.metastore.uris                    thrift://hive-metastore:9083

# pg_banking database S3 location (used by Silver register_*_table helpers)
spark.pg_banking.database.location                  s3a://warehouse/pg_banking.db

# S3A / MinIO
spark.hadoop.fs.s3a.endpoint                        http://minio:9000
spark.hadoop.fs.s3a.access.key                      minio
spark.hadoop.fs.s3a.secret.key                      minio12345
spark.hadoop.fs.s3a.path.style.access               true
spark.hadoop.fs.s3a.connection.ssl.enabled          false
spark.hadoop.fs.s3a.aws.credentials.provider        org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Silver transactions batch job (spark.silver.*)
spark.silver.bronze.input.path                      s3a://bronze/cdc/transactions
spark.silver.output.path                            s3a://silver/pg_banking/transactions
spark.silver.quarantine.path                        s3a://silver/quarantine/pg_banking/transactions
spark.silver.checkpoint.path                        s3a://silver/_checkpoints/cdc_transactions_silver

# Silver fraud_cases batch job (spark.silver.fraud_cases.*)
spark.silver.fraud_cases.bronze.input.path          s3a://bronze/cdc/fraud_cases
spark.silver.fraud_cases.output.path                s3a://silver/pg_banking/fraud_cases
spark.silver.fraud_cases.quarantine.path            s3a://silver/quarantine/pg_banking/fraud_cases
spark.silver.fraud_cases.checkpoint.path            s3a://silver/_checkpoints/cdc_fraud_cases_silver
