# Spark configuration for batch processing jobs.
# Spark loads this file automatically from $SPARK_HOME/conf/spark-defaults.conf.
# Job-specific properties use spark.<job>.* namespaces.

spark.master                                        local[*]

# Timezone — all timestamps interpreted as UTC
spark.sql.session.timeZone                          UTC

# Delta Lake extensions (required for all Delta read/write operations)
spark.sql.extensions                                io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                     org.apache.spark.sql.delta.catalog.DeltaCatalog

# S3A / MinIO
spark.hadoop.fs.s3a.endpoint                        http://minio:9000
spark.hadoop.fs.s3a.access.key                      minio
spark.hadoop.fs.s3a.secret.key                      minio12345
spark.hadoop.fs.s3a.path.style.access               true
spark.hadoop.fs.s3a.connection.ssl.enabled          false
spark.hadoop.fs.s3a.aws.credentials.provider        org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Bronze streaming job (spark.bronze.*)
spark.bronze.topic                                  cdc.transactions
spark.bronze.bootstrap.servers                      kafka:9092
spark.bronze.output.path                            s3a://bronze/cdc/transactions
spark.bronze.checkpoint.path                        s3a://bronze/_checkpoints/cdc_transactions_bronze
spark.bronze.trigger.interval                       5 minutes
spark.bronze.schema.registry.url                    http://schema-registry:8081

# Silver batch job (spark.silver.*)
spark.silver.bronze.input.path                      s3a://bronze/cdc/transactions
spark.silver.output.path                            s3a://silver/transactions
spark.silver.checkpoint.path                        s3a://silver/_checkpoints/transactions_silver
spark.silver.quarantine.path                        s3a://silver/quarantine/transactions

# Bronze fraud_cases streaming job (spark.bronze.fraud_cases.*)
spark.bronze.fraud_cases.topic                      cdc.fraud_cases
spark.bronze.fraud_cases.output.path                s3a://bronze/cdc/fraud_cases
spark.bronze.fraud_cases.checkpoint.path            s3a://bronze/_checkpoints/cdc_fraud_cases_bronze

# Silver fraud_cases batch job (spark.silver.fraud_cases.*)
spark.silver.fraud_cases.bronze.input.path          s3a://bronze/cdc/fraud_cases
spark.silver.fraud_cases.output.path                s3a://silver/fraud_cases
spark.silver.fraud_cases.checkpoint.path            s3a://silver/_checkpoints/fraud_cases_silver
spark.silver.fraud_cases.quarantine.path            s3a://silver/quarantine/fraud_cases
spark.gold.silver.input.path                        s3a://silver/transactions
spark.gold.silver.fraud.path                        s3a://silver/fraud_cases
spark.gold.customer.output.path                     s3a://gold/customer_features
spark.gold.terminal.output.path                     s3a://gold/terminal_features
# feature_date: set by Airflow (YYYY-MM-DD); empty → yesterday
spark.gold.feature.date                             
