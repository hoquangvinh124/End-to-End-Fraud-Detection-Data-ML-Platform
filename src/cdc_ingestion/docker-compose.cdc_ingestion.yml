# CDC ingestion streaming services.
# These are long-running Structured Streaming jobs (processingTime trigger).
# Start with: docker compose -f docker-compose.cdc_ingestion.yml up -d
services:
  cdc-transactions:
    build:
      context: ../..
      dockerfile: src/cdc_ingestion/Dockerfile
    environment: &cdc-otel-environment
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      DEPLOYMENT_ENVIRONMENT: local
    command:
      - /opt/spark/bin/spark-submit
      - /opt/cdc_ingestion/cdc_transactions_to_bronze.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/cdc-stream-ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      connector-init-debezium:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  cdc-fraud-cases:
    build:
      context: ../..
      dockerfile: src/cdc_ingestion/Dockerfile
    environment: *cdc-otel-environment
    command:
      - /opt/spark/bin/spark-submit
      - /opt/cdc_ingestion/cdc_fraud_cases_to_bronze.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/cdc-stream-ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      connector-init-fraud-cases:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
