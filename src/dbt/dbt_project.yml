name: ABC_Bank
version: '1.0.0'
config-version: 2

profile: fraud_detection

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ABC_Bank:
    staging:
      silver:
        +database: lakehouse
        +schema: silver
        +materialized: view
    intermediate:
      customer:
        +database: lakehouse
        +schema: silver
        +materialized: ephemeral
      terminal:
        +database: lakehouse
        +schema: silver
        +materialized: ephemeral
    marts:
      machine_learning:
        +database: clickhouse
        +schema: gold
        +materialized: incremental
