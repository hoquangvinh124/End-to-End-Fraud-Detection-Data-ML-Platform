version: 2

models:
  - name: stg_transactions
    description: "Normalized transactions from Silver pg_banking.transactions"
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: event_timestamp
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: terminal_id
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
      - name: _cdc_op
        tests:
          - accepted_values:
              values: ['r', 'c', 'u', 'd']
      - name: _staging_updated_at
        tests:
          - not_null

  - name: stg_fraud_cases
    description: "Normalized fraud cases from Silver pg_banking.fraud_cases (is_fraud pre-computed)"
    columns:
      - name: case_id
        tests:
          - not_null
          - unique
      - name: transaction_id
        tests:
          - not_null
      - name: is_fraud
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: _staging_updated_at
        tests:
          - not_null
