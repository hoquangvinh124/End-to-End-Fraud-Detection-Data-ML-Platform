services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lakehouse-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -I http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-client
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    volumes:
      - ./init:/init:ro
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  metastore-db:
    image: postgres:16
    container_name: metastore-db
    hostname: metastore-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: starburstdata/hive:3.1.2-e.18
    container_name: hive-metastore
    hostname: hive-metastore
    ports:
      - "9083:9083"
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore-db:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
      S3_PATH_STYLE_ACCESS: "true"
    depends_on:
      metastore-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  trino:
    image: trinodb/trino:481
    container_name: trino
    hostname: trino
    ports:
      - "8090:8080"
    volumes:
      - ./trino/etc:/usr/lib/trino/etc:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      hive-metastore:
        condition: service_started
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:head-distroless
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  minio_data:
  metastore_db_data:
  clickhouse_data:
