global:
  resolve_timeout: 5m

route:
  receiver: discord-pipeline-alerts
  group_by: [alertname, severity, pipeline_stage]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord-pipeline-alerts
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}**{{ .Labels.severity }}** {{ .Annotations.summary }}\n{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  - source_matchers:
      - severity="critical"
      - pipeline_stage=~"cdc|bronze"
    target_matchers:
      - pipeline_stage=~"silver|gold|online"
    equal: [dataset]
