services:
  fraud-detection-api:
    build:
      context: ../..
      dockerfile: src/api/dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    environment:
      MODEL_SOURCE: mlflow
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_MODEL_NAME: fraud-detection
      MLFLOW_MODEL_ALIAS: champion
      FEAST_REPO_PATH: /app/feature_store
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      OTEL_SERVICE_NAME: fraud-detection-api
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      mlflow-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started

  pipeline-observer:
    build:
      context: ../..
      dockerfile: src/pipeline_monitoring/Dockerfile
    container_name: pipeline-observer
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      DEPLOYMENT_ENVIRONMENT: local
      PIPELINE_OBSERVER_INTERVAL_SECONDS: "30"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-abcbank}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-abcbank}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      alertmanager:
        condition: service_started

  alertmanager-secret-init:
    image: busybox:1.36
    container_name: alertmanager-secret-init
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    command:
      - sh
      - -c
      - >-
        umask 077;
        if [ -n "$$DISCORD_WEBHOOK_URL" ]; then
          printf '%s' "$$DISCORD_WEBHOOK_URL" > /secrets/discord_webhook_url;
        else
          printf '%s' 'http://127.0.0.1/discord-disabled' > /secrets/discord_webhook_url;
        fi
    volumes:
      - alertmanager_secrets:/secrets
    restart: "no"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    ports:
      - "9093:9093"
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_secrets:/run/secrets:ro
      - alertmanager_data:/alertmanager
    depends_on:
      alertmanager-secret-init:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
  alertmanager_secrets:
