# Airflow 3 stack for the fraud detection batch pipeline.
#
# Usage:
#   docker compose -f docker-compose.airflow.yml up -d
#   open http://localhost:8089  (admin / admin)
#
# Airflow 3 service architecture:
#   api-server     — REST API + web UI  (replaces 2.x webserver, port 8090)
#   dag-processor  — parses DAG files   (NEW required service in Airflow 3)
#   scheduler      — monitors tasks and triggers runs
#   triggerer      — handles deferrable tasks
#
# Infrastructure config for DAGs is passed as environment variables to avoid
# parse-time Variable.get() calls (Airflow 3 best practice):
#   SPARK_BATCH_IMAGE  — Docker image built from src/batch_processing/Dockerfile
#                        e.g. mlops-batch:latest
#   DOCKER_NETWORK     — network shared with Kafka and MinIO
#                        run: docker network ls --filter name=default
#                        e.g. cdc_default or mlops_default
#
# CDC ingestion (continuous Structured Streaming) runs separately:
#   docker compose -f src/cdc_ingestion/docker-compose.cdc_ingestion.yml up -d
#
# The DockerOperator mounts /var/run/docker.sock so tasks launch containers
# directly on the host Docker daemon (same daemon as Kafka/MinIO).

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API_SERVER__EXPOSE_CONFIG: "true"
    # DAG infrastructure config — read by feature_pipeline_daily.py via os.environ
    SPARK_BATCH_IMAGE: "mlops-batch:latest"
    DOCKER_NETWORK: "mlops_default"
    # Absolute in-container path to materialize_to_redis.py (feature_store/ is
    # mounted at /opt/airflow/feature_store — see volumes below).
    MATERIALIZE_SCRIPT_PATH: "/opt/airflow/feature_store/materialize_to_redis.py"
    TRINO_HOST: "trino"
    TRINO_PORT: "8080"
    CLICKHOUSE_HOST: "clickhouse"
    CLICKHOUSE_PORT: "8123"
    MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
    DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
    PYTHONPATH: "/opt/airflow"
    # Install providers at startup (avoids custom image build)
    # standard provider: BashOperator and other core operators moved here in Airflow 3
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      apache-airflow-providers-docker>=3.9.0
      apache-airflow-providers-standard>=1.0.0
      astronomer-cosmos==1.14.1
      dbt-core~=1.10.0
      dbt-trino==1.10.1
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ../api:/opt/airflow/api:ro
    - ../feature_store:/opt/airflow/feature_store:ro
    - ../training:/opt/airflow/training:ro
    - ../dbt:/opt/airflow/dbt:ro
    - airflow_logs:/opt/airflow/logs
    # DockerOperator needs access to host Docker daemon
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command: >
      -c "
        pip install 'apache-airflow-providers-docker>=3.9.0' 'apache-airflow-providers-standard>=1.0.0' 'astronomer-cosmos==1.14.1' 'dbt-core~=1.10.0' 'dbt-trino==1.10.1' --quiet &&
        airflow db migrate
      "
    restart: "no"

  # Replaces airflow-webserver from Airflow 2.x
  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    command: api-server
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy

  # Required in Airflow 3: parses DAG files independently from the scheduler
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-api-server:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-api-server:
        condition: service_healthy

  # Handles deferrable tasks (recommended in Airflow 3)
  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    restart: unless-stopped
    depends_on:
      airflow-api-server:
        condition: service_healthy

volumes:
  airflow_postgres_data:
  airflow_logs:
